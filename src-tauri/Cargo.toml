[package]
name = "repoguardia-gui"
version = "0.1.0"
description = "A Tauri App"
authors = ["DarkDeceptio"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rsbash = "2.1.0"
tauri-plugin-shell = "2.3.4"
